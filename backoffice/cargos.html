<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cargos e Funções · SupplyFlow</title>
  <link rel="icon" href="../static/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../static/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../static/css/supplyflow.css">
</head>
<body data-pagina="cargos">
  <div class="app">

    <div class="sidebar-trilho">
      <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar" aria-label="Menu"></aside>
    </div>

    <div class="app__principal">
      <header class="topbar" id="topbar"></header>

      <main class="conteudo">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h1 class="pagina-titulo mb-1">Cargos e Funções</h1>
            <p class="pagina-descricao mb-0">Cargos em uso no cadastro de funcionários e os produtos que as <a href="politicas.html">políticas de fornecimento</a> vinculam a cada um.</p>
          </div>
        </div>

        <section class="cartao" aria-label="Lista de cargos">
          <div class="table-responsive" tabindex="0" role="region" aria-label="Tabela de cargos e funções">
            <table class="tabela-solicitacoes tabela-solicitacoes--compacta">
              <thead>
                <tr>
                  <th scope="col">Cargo / Função</th>
                  <th scope="col">Setores</th>
                  <th scope="col">Funcionários ativos</th>
                  <th scope="col">Produtos com política para o cargo</th>
                </tr>
              </thead>
              <tbody id="tabela-cargos-corpo">
                <tr><td colspan="4" class="text-center py-4 text-muted">Carregando cargos...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

  </div>

  <script src="../static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../static/js/menu.js"></script>
  <script src="../static/js/api.js"></script>
  <script src="../static/js/sessao.js"></script>
  <script src="../static/js/backoffice.js"></script>
  <script>
    (function () {
      var corpo = document.getElementById("tabela-cargos-corpo");
      var escapar = SF.escapar;

      function criarLinhaCargoHtml(itemCargo) {
        var textoSetores = itemCargo.setores.join(", ") || "—";
        var htmlProdutosVinculados;

        if (itemCargo.produtos_vinculados && itemCargo.produtos_vinculados.length > 0) {
          htmlProdutosVinculados = escapar(itemCargo.produtos_vinculados.join(", "));
        } else {
          htmlProdutosVinculados = '<span class="text-muted">Nenhuma política específica — vale o padrão de cada produto</span>';
        }

        return (
          "<tr>" +
            "<td><strong>" + escapar(itemCargo.cargo) + "</strong></td>" +
            "<td>" + escapar(textoSetores) + "</td>" +
            "<td>" + escapar(itemCargo.total_funcionarios) + "</td>" +
            '<td class="small">' + htmlProdutosVinculados + "</td>" +
          "</tr>"
        );
      }

      SF.api.get("/api/cargos/")
        .then(function (dados) {
          var listaCargos = dados.cargos || [];
          if (listaCargos.length === 0) {
            corpo.innerHTML = '<tr><td colspan="4" class="tabela-solicitacoes__vazio">Nenhum cargo cadastrado.</td></tr>';
            return;
          }
          corpo.innerHTML = listaCargos.map(criarLinhaCargoHtml).join("");
        })
        .catch(function (erro) {
          corpo.innerHTML = '<tr><td colspan="4" class="tabela-solicitacoes__vazio">' + escapar(erro.message) + "</td></tr>";
        });
    })();
  </script>
</body>
</html>
